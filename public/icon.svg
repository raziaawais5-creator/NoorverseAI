<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#0F2D37" />
      <stop offset="100%" stop-color="#0B1320" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0B1320" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle (Apple & Android adaptive icon ready) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)" />

  <!-- Outer Geometric Islamic Star Frame -->
  <g transform="translate(256, 256) scale(0.92) translate(-256, -256)" filter="url(#shadow)">
    <!-- 8-Pointed Star Outline -->
    <rect x="96" y="96" width="320" height="320" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.3" />
    <rect x="96" y="96" width="320" height="320" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.3" transform="rotate(45 256 256)" />
    
    <!-- Inner Radiant Circle -->
    <circle cx="256" cy="256" r="160" fill="#0B1B2B" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="6" />
  </g>

  <!-- Central Arabic Noon 'ن' Calligraphy -->
  <!-- Arc of Noon -->
  <path d="M 170 240 C 170 335, 342 335, 342 240" fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" filter="url(#shadow)" />
  
  <!-- Nuqta (Dot of Noon - rotated diamond) -->
  <polygon points="256,170 274,196 256,222 238,196" fill="url(#goldGrad)" filter="url(#shadow)" />

  <!-- Small 8-point sparkling star at top right -->
  <g transform="translate(360, 140) scale(0.7)">
    <path d="M 0,-18 L 4,-5 L 18,0 L 4,5 L 0,18 L -4,5 L -18,0 L -4,-5 Z" fill="#FDE68A" />
  </g>
</svg>
